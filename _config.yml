# Jekyll Configuration for Aldrean Novel
title: "Aldrean"
description: "A dark fantasy novel"
url: "https://nitro-supreme.github.io/Aldrean"
baseurl: "/Aldrean"

# Theme
theme: null

# Markdown processor
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

# Syntax highlighting
highlight: rouge

# Exclude from processing
exclude:
  - .gitignore
  - README.md
  - Gemfile
  - Gemfile.lock

# Enable plugins
plugins:
  - jekyll-sitemap
  - jekyll-feed

# Collections for chapters, characters, and side stories
collections:
  chapters:
    output: true
#    permalink: /chapters/:name/
  characters:
    output: true
    permalink: /characters/:name/
  side_stories:
    output: true
    permalink: /side-stories/:name/

defaults:
  - scope:
      path: ""
      type: "chapters"
    values:
  - scope:
      path: ""
      type: "characters"
    values:
      layout: "character"
  - scope:
      path: ""
      type: "side_stories"
    values:
      layout: "side-story"
