<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | {{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Crimson+Text:ital@0;1&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="{{ '/' | relative_url }}" class="nav-logo">{{ site.title }}</a>
      <div class="nav-menu">
        <a href="{{ '/' | relative\_url }}" class="nav-link">Home</a>
        <a href="{{ '/#table-of-contents' | relative\_url }}" class="nav-link">Chapters</a>
        <a href="{{ '/characters/' | relative\_url }}" class="nav-link">Characters</a>
        <a href="{{ '/terms/' | relative\_url }}" class="nav-link">Terms</a>
        <a href="{{ '/side-stories/' | relative\_url }}" class="nav-link">Side Stories</a>
      </div>
    </div>
  </nav>

  <main class="container">
    {{ content }}
  </main>

  <footer class="footer">
    <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }}. All rights reserved.</p>
  </footer>
</body>
</html>
